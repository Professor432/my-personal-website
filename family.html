        <!--
            CSS CHECKBOX
            Clicking this card opens all 6 photos.
        -->

        <input
            type="checkbox"
            id="memory-toggle"
            class="memory-toggle"
        >


        <label
            for="memory-toggle"
            class="memory-box"
        >

            <div class="photo-stack">

                        src="images/friend3.jpeg"

                    Friends

                <div class="box-text">
                    🤝 ❤️ 📸
                </div>

            </div>

        </label>
